#HTML page
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digit Recognition</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0f4f8;
        text-align: center;
        padding: 40px 15px;
      }

      .container {
        background: white;
        max-width: 450px;
        margin: auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 15px #cccccc;
      }

      input,
      button {
        margin: 15px 0;
        padding: 12px;
      }

      button {
        background: #1769aa;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .result {
        margin-top: 20px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Handwritten Digit Recognition</h1>
      <p>Upload an image containing one handwritten digit (0-9).</p>

      <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required />
        <br />
        <button type="submit">Predict Digit</button>
      </form>

      {% if prediction is not none %}
      <div class="result">
        <h2>Predicted Digit: {{ prediction }}</h2>
        <p>Model confidence: {{ confidence }}%</p>
      </div>
      {% endif %} {% if error %}
      <p style="color: red">{{ error }}</p>
      {% endif %}
    </div>
  </body>
</html>
